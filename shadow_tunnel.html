<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Shadow Tunnel</title>
<style>
:root{
  --bg:#F5F0FF;--surface:#FFFFFF;--surface2:#EDE4FF;--line:#D6C6F5;
  --text:#1A0B33;--muted:#6B5A8E;--accent:#7A1FE0;--accent2:#5B14B8;--on-accent:#FFFFFF;
  --ok:#0E9F6E;--warn:#B7791F;--bad:#D6336C;--glow:rgba(122,31,224,.18);
  --r-lg:22px;--r-md:14px;--r-sm:9px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#09050F;--surface:#150C26;--surface2:#1F1338;--line:#3A2466;
    --text:#F3ECFF;--muted:#A593C8;--accent:#9B3DFF;--accent2:#C77DFF;--on-accent:#FFFFFF;
    --ok:#3DDC97;--warn:#FFB84D;--bad:#FF5C7A;--glow:rgba(155,61,255,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* Démarrage */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .2s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 0 48px var(--glow)}

/* En-tête */
header{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  border-bottom:1px solid var(--line);background:var(--surface)}
header img{width:40px;height:40px;border-radius:10px;flex:none}
.brand{font-weight:900;font-style:italic;font-size:21px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:900}
.chip{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface2);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap}

main{flex:1;overflow-y:auto;padding:16px 16px 28px;-webkit-overflow-scrolling:touch}
h2{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:600}
h2:first-child{margin-top:0}

/* Carte d'état */
.status{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--accent);
  border-radius:var(--r-lg);padding:18px;box-shadow:0 0 34px var(--glow)}
.status .nm{font-weight:700;font-size:18px;word-break:break-word}
.status .sub{color:var(--muted);font-size:14px;margin-top:2px;word-break:break-all}
.big{font-size:44px;font-weight:800;font-style:italic;line-height:1;margin:14px 0 4px}
.big small{font-size:18px;font-weight:600;margin-left:4px;color:var(--muted);font-style:normal}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface2);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dng{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.blk{display:flex;width:100%}
.btn[disabled]{opacity:.5}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}

/* Liste */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 8px 12px 14px;cursor:pointer}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);
  color:var(--accent2);margin-right:6px;font-weight:600}
.ms{font-size:13px;font-weight:700;white-space:nowrap}
.more{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:26px 18px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}

/* Navigation */
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:12px;color:var(--muted);cursor:pointer}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent2);font-weight:700}
@media (prefers-color-scheme:light){nav button.on{color:var(--accent)}}

/* Fenêtres */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,2,12,.62);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow-y:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet .btn{margin-top:8px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input[disabled]{opacity:.55}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);
  padding:10px 16px;border-radius:99px;font-size:14px;z-index:70;max-width:86%;text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.4)}
.about{text-align:center}
.about img{width:150px;height:150px;border-radius:32px;box-shadow:0 0 44px var(--glow)}
.about p{color:var(--muted);text-align:left}
.about .brand{font-size:26px;margin:14px 0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;text-align:left}
.card p{margin:0 0 8px;color:var(--text)}.card p:last-child{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="splash"><img data-logo alt="Shadow Tunnel"><div class="brand">Shadow <b>Tunnel</b></div></div>

<header>
  <img data-logo alt="">
  <div class="brand">Shadow <b>Tunnel</b></div>
  <div class="chip" id="chip">Hors tunnel</div>
</header>

<main id="app"></main>

<nav>
  <button data-v="profils" class="on"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Profils</button>
  <button data-v="outils"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Outils</button>
  <button data-v="apropos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>À propos</button>
</nav>

<div id="modal"><div class="sheet" id="sheet"></div></div>

var KEY='shadowtunnel.v1', mem=null;
function logos(){document.querySelectorAll('img[data-logo]').forEach(function(i){if(!i.getAttribute('src'))i.src=LOGO;});}
var PROTO={vless:'VLESS',vmess:'VMess',trojan:'Trojan',ss:'Shadowsocks',ssh:'SSH',slowdns:'SSH + SlowDNS',other:'Autre'};
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.profiles))return o;}}catch(e){}

}

function $(id){return document.getElementById(id);}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

  var o=document.querySelector('.toast');if(o)o.remove();

}

/* ---------- Analyse des liens ---------- */
function b64d(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,'');
  while(s.length%4)s+='=';
  var bin=atob(s),u='';
  try{u=decodeURIComponent(bin.split('').map(function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''));}
  catch(e){u=bin;}
  return u;
}
function dec(s){try{return decodeURIComponent(s);}catch(e){return s;}}
function okPort(n){return isFinite(n)&&n>=1&&n<=65535&&Math.floor(n)===n;}
function parseLink(raw){
  var s=(raw||'').trim(),m;
  if(!s)return null;
  try{
    if(/^vmess:\/\//i.test(s)){
      var j=JSON.parse(b64d(s.slice(8)));
      var pt=parseInt(j.port,10);
      if(!j.add||!okPort(pt))return null;
      return {proto:'vmess',host:String(j.add),port:pt,name:j.ps||String(j.add),link:s};
    }
    if(/^ss:\/\//i.test(s)){
      var body=s.slice(5),name='';
      var h=body.indexOf('#');if(h>=0){name=dec(body.slice(h+1));body=body.slice(0,h);}
      var q=body.indexOf('?');if(q>=0)body=body.slice(0,q);
      var rest=body;
      if(body.indexOf('@')<0)rest=b64d(body);
      m=rest.match(/@(\[[^\]]+\]|[^:\/@]+):(\d+)\/?$/);
      if(!m)return null;
      var p1=parseInt(m[2],10);if(!okPort(p1))return null;
      return {proto:'ss',host:m[1].replace(/^\[|\]$/g,''),port:p1,name:name||m[1],link:s};
    }
    m=s.match(/^(vless|trojan):\/\/([^@\s]+)@(\[[^\]]+\]|[^:\/?#\s]+):(\d+)([^#\s]*)(?:#(.*))?$/i);
    if(m){
      var p2=parseInt(m[4],10);if(!okPort(p2))return null;
      return {proto:m[1].toLowerCase(),host:m[3].replace(/^\[|\]$/g,''),port:p2,name:m[6]?dec(m[6]):m[3],link:s};
    }
  }catch(e){return null;}
  return null;
}

/* ---------- Test TCP via le pont Android ---------- */
var pend={};
window.__ping=function(t,ms){var f=pend[t];if(f){delete pend[t];f(ms);}};
function ping(p){
  return new Promise(function(res){
    if(!hasA('tcpPing')){res(-2);return;}
    var t=uid();pend[t]=res;
    try{window.Android.tcpPing(t,p.host,p.port,4000);}catch(e){delete pend[t];res(-2);return;}
    setTimeout(function(){if(pend[t]){delete pend[t];res(-1);}},7000);
  });
}
function applyPing(p,ms){
  if(ms===-2){toast('Le test fonctionne seulement dans l’application');return;}
  p.ms=ms;p.at=Date.now();save();
}
function cls(ms){return ms<0?'bad':ms<150?'ok':ms<400?'warn':'bad';}
function msTxt(p){
  if(typeof p.ms!=='number')return '<span class="ms mut">Non testé</span>';
  if(p.ms<0)return '<span class="ms bad">Injoignable</span>';
  return '<span class="ms '+cls(p.ms)+'">'+p.ms+' ms</span>';
}
function getSel(){
  for(var i=0;i<S.profiles.length;i++)if(S.profiles[i].id===S.sel)return S.profiles[i];
  return null;
}
function byId(id){for(var i=0;i<S.profiles.length;i++)if(S.profiles[i].id===id)return S.profiles[i];return null;}

  bind();
}
function vProfils(){
  var h='',p=getSel();
  if(p){
    var big=typeof p.ms==='number'?(p.ms<0?'<span class="bad" style="font-size:28px">Injoignable</span>':'<span class="'+cls(p.ms)+'">'+p.ms+'</span><small>ms</small>'):'<span class="mut" style="font-size:28px">Non testé</span>';
    h+='<div class="status"><div class="nm">'+esc(p.name)+'</div><div class="sub"><span class="tag">'+esc(PROTO[p.proto]||p.proto)+'</span>'+esc(p.host)+':'+p.port+'</div>'
      +'<div class="big">'+big+'</div>'
      +'<div class="row"><button class="btn pri" data-a="ping-sel"'+(busy?' disabled':'')+'>'+(busy?'Test en cours…':'Tester le serveur')+'</button></div>'
      +'<div class="note">Ce test mesure l’accès TCP au serveur. Il n’ouvre pas de tunnel.</div></div>';
  }else{
    h+='<div class="status"><div class="nm">Aucun profil choisi</div><div class="sub">Ajoutez un profil, puis touchez-le pour le sélectionner.</div></div>';
  }
  h+='<h2>Mes profils ('+S.profiles.length+')</h2>';
  if(!S.profiles.length){
    h+='<div class="empty"><p>Vous n’avez aucun profil.</p><button class="btn pri" data-a="add">Ajouter un profil</button></div>';
  }else{
    h+='<div class="list">';
    S.profiles.forEach(function(x){
      h+='<div class="item'+(x.id===S.sel?' sel':'')+'" data-id="'+esc(x.id)+'"><div class="tx"><div class="t1">'+esc(x.name)+'</div>'
        +'<div class="t2"><span class="tag">'+esc(PROTO[x.proto]||x.proto)+'</span>'+esc(x.host)+':'+x.port+'</div></div>'
        +msTxt(x)+'<button class="more" data-more="'+esc(x.id)+'" aria-label="Actions">⋯</button></div>';
    });
    h+='</div><div class="row"><button class="btn pri" data-a="add">Ajouter un profil</button></div>';
  }
  return h;
}
function vOutils(){
  var n=S.profiles.length;
  return '<h2>Serveurs</h2><div class="list">'
   +'<button class="btn blk" data-a="ping-all"'+(busy||!n?' disabled':'')+'>'+(busy?'Test en cours…':'Tester tous les profils')+'</button>'
   +'<button class="btn blk" data-a="sort"'+(n<2?' disabled':'')+'>Trier du plus rapide au plus lent</button></div>'
   +'<h2>Sauvegarde</h2><div class="list">'
   +'<button class="btn blk" data-a="export"'+(n?'':' disabled')+'>Partager tous les profils</button>'
   +'<button class="btn dng blk" data-a="wipe"'+(n?'':' disabled')+'>Supprimer tous les profils</button></div>'
   +'<h2>Téléphone</h2><div class="list">'
   +'<button class="btn blk" data-a="vpnset">Ouvrir les réglages VPN d’Android</button></div>';
}
function vApropos(){
  return '<div class="about"><img data-logo alt="Shadow Tunnel"><div class="brand">Shadow <b>Tunnel</b></div>'
   +'<p style="text-align:center;margin:0 0 16px">Version 1.0</p>'
   +'<div class="card"><p><b>Ce que fait l’application</b></p>'
   +'<p>Elle range vos profils de serveurs (VLESS, VMess, Trojan, Shadowsocks, SSH), importe leurs liens, mesure leur temps de réponse et les partage.</p></div>'
   +'<div class="card" style="margin-top:10px"><p><b>Ce qu’elle ne fait pas</b></p>'
   +'<p>Elle ne contient pas de moteur de tunnel : aucune connexion VPN n’est établie et votre trafic n’est ni chiffré ni redirigé. Les données restent sur votre téléphone.</p></div></div>';
}

/* ---------- Événements ---------- */
function bind(){
  var a=$('app');
  a.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){act(b.getAttribute('data-a'));};});
  a.querySelectorAll('.item').forEach(function(it){
    it.onclick=function(e){
      if(e.target.closest('.more'))return;
      S.sel=it.getAttribute('data-id');save();render();
    };
  });
  a.querySelectorAll('[data-more]').forEach(function(b){b.onclick=function(e){e.stopPropagation();rowMenu(b.getAttribute('data-more'));};});
}
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick=function(){view=b.getAttribute('data-v');render();};
});
function act(k){
  if(k==='add')return addMenu();
  if(k==='ping-sel'){var p=getSel();if(p)runPing([p]);return;}
  if(k==='ping-all')return runPing(S.profiles.slice());
  if(k==='sort'){
    S.profiles.sort(function(x,y){
      var a=typeof x.ms==='number'&&x.ms>=0?x.ms:1e9,b=typeof y.ms==='number'&&y.ms>=0?y.ms:1e9;return a-b;});
    save();render();toast('Profils triés');return;
  }
  if(k==='export')return exportAll();
  if(k==='wipe')return confirmM('Supprimer tous les profils ?','Cette action est définitive.','Tout supprimer',function(){S.profiles=[];S.sel=null;save();closeModal();render();toast('Profils supprimés');});
  if(k==='vpnset'){
    if(hasA('openVpnSettings'))window.Android.openVpnSettings();else toast('Disponible dans l’application');
  }
}
function runPing(list){
  if(busy||!list.length)return;
  if(!hasA('tcpPing')){toast('Le test fonctionne seulement dans l’application');return;}
  busy=true;render();
  var i=0;
  (function next(){
    if(i>=list.length){busy=false;render();toast('Test terminé');return;}
    var p=list[i++];
    ping(p).then(function(ms){applyPing(p,ms);render();next();});
  })();
}
function confirmM(t,msg,label,ok){
  modal(t,'<p class="mut" style="margin:0">'+esc(msg)+'</p>',[{t:label,cls:'dng',cb:ok},{t:'Annuler',cb:closeModal}]);
}
function addMenu(){
  modal('Ajouter un profil','<p class="mut" style="margin:0 0 4px">Choisissez comment ajouter votre serveur.</p>',[
    {t:'Importer des liens',cls:'pri',cb:importM},
    {t:'Saisir à la main',cb:function(){editM(null);}},
    {t:'Annuler',cb:closeModal}]);
}
function importM(){
  modal('Importer des liens',
   '<label for="imp">Un lien par ligne (vless://, vmess://, trojan://, ss://)</label><textarea id="imp" autocomplete="off" spellcheck="false"></textarea><div class="err" id="err"></div>',
   [{t:'Importer',cls:'pri',cb:function(){
      var lines=$('imp').value.split(/\s+/).filter(Boolean),ok=0,ko=0;
      if(!lines.length){setErr('Collez au moins un lien.');return;}
      lines.forEach(function(l){
        var r=parseLink(l);
        if(!r){ko++;return;}
        S.profiles.push({id:uid(),name:r.name,proto:r.proto,host:r.host,port:r.port,link:r.link,note:''});ok++;
      });
      if(!ok){setErr('Aucun lien valide. Vérifiez le format et copiez le lien en entier.');return;}
      if(!S.sel)S.sel=S.profiles[S.profiles.length-1].id;
      save();closeModal();render();
      toast(ok+' profil'+(ok>1?'s importés':' importé')+(ko?' · '+ko+' ignoré'+(ko>1?'s':''):''));
   }},{t:'Annuler',cb:closeModal}]);
}
function editM(p){
  var lk=!!(p&&p.link),opts='';
  Object.keys(PROTO).forEach(function(k){opts+='<option value="'+k+'"'+(p&&p.proto===k?' selected':'')+'>'+PROTO[k]+'</option>';});
  modal(p?'Modifier le profil':'Nouveau profil',
   '<label for="f-n">Nom</label><input id="f-n" maxlength="60" value="'+esc(p?p.name:'')+'">'
   +'<label for="f-p">Type</label><select id="f-p"'+(lk?' disabled':'')+'>'+opts+'</select>'
   +'<label for="f-h">Adresse du serveur</label><input id="f-h" autocapitalize="none" autocomplete="off" value="'+esc(p?p.host:'')+'"'+(lk?' disabled':'')+'>'
   +'<label for="f-o">Port</label><input id="f-o" inputmode="numeric" value="'+(p?p.port:'443')+'"'+(lk?' disabled':'')+'>'
   +'<label for="f-t">Note (facultatif)</label><input id="f-t" maxlength="120" value="'+esc(p?p.note:'')+'">'
   +(lk?'<div class="note">L’adresse et le port d’un profil importé ne se modifient pas.</div>':'')
   +'<div class="err" id="err"></div>',
   [{t:'Enregistrer',cls:'pri',cb:function(){
      var n=$('f-n').value.trim(),h=$('f-h').value.trim(),o=parseInt($('f-o').value,10);
      if(!lk){
        if(!h||/[\s\/:@]/.test(h)){setErr('Saisissez une adresse valide, sans « : » ni « / ».');return;}
        if(!okPort(o)){setErr('Le port doit être un nombre entre 1 et 65535.');return;}
      }
      if(!n)n=h||p.host;
      if(p){p.name=n;p.note=$('f-t').value.trim();if(!lk){p.host=h;p.port=o;p.proto=$('f-p').value;p.ms=undefined;}}
      else{
        var np={id:uid(),name:n,proto:$('f-p').value,host:h,port:o,link:'',note:$('f-t').value.trim()};
        S.profiles.push(np);if(!S.sel)S.sel=np.id;
      }
      save();closeModal();render();toast('Profil enregistré');
   }},{t:'Annuler',cb:closeModal}]);
}
function profText(p){return p.link||(PROTO[p.proto]||p.proto)+' '+p.host+':'+p.port+' — '+p.name;}
function copy(t){
  if(hasA('copyText')){window.Android.copyText(t);toast('Copié');return;}
  try{navigator.clipboard.writeText(t).then(function(){toast('Copié');},function(){toast('Copie impossible');});}
  catch(e){toast('Copie impossible');}
}
function share(t){
  if(hasA('shareText'))window.Android.shareText(t);else copy(t);
}
function rowMenu(id){
  var p=byId(id);if(!p)return;
  modal(p.name,'<div class="mut" style="margin-bottom:6px;word-break:break-all">'+esc(PROTO[p.proto]||p.proto)+' · '+esc(p.host)+':'+p.port+(p.note?'<br>'+esc(p.note):'')+'</div>',[
    {t:'Tester',cls:'pri',cb:function(){closeModal();runPing([p]);}},
    {t:'Copier',cb:function(){closeModal();copy(profText(p));}},
    {t:'Partager',cb:function(){closeModal();share(profText(p));}},
    {t:'Modifier',cb:function(){editM(p);}},
    {t:'Supprimer',cls:'dng',cb:function(){
      confirmM('Supprimer ce profil ?',p.name,'Supprimer',function(){
        S.profiles=S.profiles.filter(function(x){return x.id!==p.id;});
        if(S.sel===p.id)S.sel=S.profiles.length?S.profiles[0].id:null;
        save();closeModal();render();toast('Profil supprimé');});
    }},
    {t:'Fermer',cb:closeModal}]);
}
function exportAll(){share(S.profiles.map(profText).join('\n'));}

/* Bouton retour : renvoie true si la page l'a géré */
window.shadowBack=function(){
  if($('modal').classList.contains('on')){closeModal();return true;}
  if(view!=='profils'){view='profils';render();return true;}
  return false;
};

logos();
render();
setTimeout(function(){var s=$('splash');s.classList.add('out');setTimeout(function(){s.remove();},220);},750);
})();
</script>
